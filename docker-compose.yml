services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment: &sql-environment
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev_Only!Moe2026}
    ports:
      - "1433:1433"
    volumes:
      - market-opportunity-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  sqlserver-test-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["validation"]
    environment: *sql-environment
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        export SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}"
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -b -d master -Q "IF DB_ID(N'MarketOpportunityEngine_LiveValidationTests') IS NULL CREATE DATABASE [MarketOpportunityEngine_LiveValidationTests];"
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -b -d MarketOpportunityEngine_LiveValidationTests -Q "SET NOCOUNT ON; SELECT DB_NAME() AS ValidationDatabase;"

volumes:
  market-opportunity-sql-data:
